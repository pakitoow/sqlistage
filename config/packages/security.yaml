security:
    # 1. Password hashing
    password_hashers:
        App\Entity\User:
            algorithm: plaintext

    # 2. User providers
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # 3. Firewalls
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Your custom authenticator
            custom_authenticator: App\Security\AppAuthenticator

            # Built-in form login for fallback
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_log

            # Tell Symfony which authenticator to start with (entry point)
            entry_point: App\Security\AppAuthenticator

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # 4. Access Control
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/css, roles: PUBLIC_ACCESS }
        - { path: ^/js, roles: PUBLIC_ACCESS }
        - { path: ^/images, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/log, roles: ROLE_ADMIN }
